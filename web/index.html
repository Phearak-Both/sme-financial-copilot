<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bookkeeping assistant for small businesses and farmers in Cambodia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SME Copilot">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SME Copilot</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Start the big downloads right away. Safari otherwise fetches the app
    code only after the graphics engine, and the fonts after both.
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Shown until Flutter draws its first frame, in the chosen theme. -->
  <style>
    body { margin: 0; background: #F4EEE3; }
    body.dark { background: #0F1A2E; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1F2A24;
      transition: opacity .25s;
    }
    body.dark #splash { color: #EDE5D6; }
    /* Same mark as the sign-in page. */
    #splash .logo {
      width: 72px; height: 72px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      background: #1E4D3B; color: #FBF8F2;
    }
    body.dark #splash .logo { background: #1E2E4A; color: #9CCBB0; }
    #splash .logo svg { width: 36px; height: 36px; fill: currentColor; }
    #splash .name { font-size: 22px; font-weight: 700; }
    #splash .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(30, 77, 59, .2); border-top-color: #1E4D3B;
      animation: spin .9s linear infinite;
    }
    body.dark #splash .spinner {
      border-color: rgba(156, 203, 176, .2); border-top-color: #9CCBB0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <script>
    // The app saves the theme as a JSON string under this key.
    try {
      if (localStorage.getItem('flutter.setting.themeMode') === '"dark"') {
        document.body.classList.add('dark');
      }
    } catch (_) {}
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <div id="splash" aria-busy="true">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 7.28V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-2.28c.59-.35 1-.98 1-1.72V9c0-.74-.41-1.37-1-1.72zM20 9v6h-7V9h7zM5 19V5h14v2h-6c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h6v2H5z"/>
        <circle cx="16" cy="12" r="1.5"/>
      </svg>
    </div>
    <div class="name">SME Copilot</div>
    <div class="spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
